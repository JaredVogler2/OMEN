# OMEN settings. Every key is optional (code defaults shown); unknown keys are rejected so typos fail loudly.
# Secrets (Discord webhooks / bot token, Kalshi API key) live in the environment, never here. See .env.example.

[scan]
hot_interval_seconds = 300        # markets closing within hot_horizon_hours: re-priced every 5 minutes
hot_horizon_hours = 72
full_interval_seconds = 3600      # every open market (~170k, ~175 requests): hourly
events_refresh_seconds = 1800     # incremental event metadata (mutually-exclusive flags) via min_updated_ts
series_refresh_seconds = 21600    # fee type + multiplier of every series (one request)
fee_changes_refresh_seconds = 1800  # scheduled series fee changes and per-event fee overrides
settle_interval_seconds = 1800    # settle paper positions and model predictions from official results
model_interval_seconds = 60       # crypto model fast lane
max_requests_per_second = 8.0     # Kalshi Basic tier allows 20/s; stay well under it
min_minutes_to_close = 3          # ignore markets about to close (no time to execute)
request_timeout_seconds = 30.0

[lock]
# Structural (guaranteed-by-contract) plays. All money values are after every fee.
min_profit_usd = "1.00"           # guaranteed profit floor per play
min_return_pct = "0.75"           # guaranteed profit / capital
min_apr_pct = "15"                # annualized; filters plays that lock capital for months for pennies
max_capital_usd = "1000"          # sizing cap per play (the alert shows the size the book supports up to this)
max_contracts_per_leg = "5000"
max_plausible_return_pct = "20"   # above this a "lock" is sent to #kalshi-status for a manual rules check instead
whole_contracts = true            # Kalshi accepts 0.01-contract fractions; whole contracts are simpler to trade
enable_no_basket = true
enable_ladder = true
enable_yes_partition = true
enable_cover = true               # cross-series locks: "above X" thresholds + "X to Y" buckets on the same number
allow_step_gap_partitions = true  # buckets like "59-60" / "61-62" rely on whole-unit reporting

[fees]
rounding_increment = "0.01"       # round each fill's fee UP to this (cent = conservative; direct members: 0.0001)
schedule_file = "config/fee_schedule.toml"
change_guard_minutes = 60         # within this window of a scheduled fee change, use the more expensive terms
verify_reminder_days = 30

[crypto]
enabled = true
min_minutes_to_close = 5
max_hours_to_close = 36
vol_safety_multiplier = 1.30
vol_floor_annual = 0.25
student_t_dof = 4.0
spot_basis_band_pct = 0.15
max_spot_age_seconds = 30
min_edge = 0.03                   # conservative probability must beat price + fee by 3 points
min_conservative_probability = 0.85  # favorites only: worst-case win probability of the bought side
max_price = "0.985"
max_capital_usd = "200"
prediction_log_interval_minutes = 360  # calibration sample per market (alerts are always logged)

[crypto.series]
KXBTCD = "BTC"
KXBTC = "BTC"
KXETHD = "ETH"
KXETH = "ETH"
KXSOLD = "SOL"
KXSOLE = "SOL"
KXXRPD = "XRP"
KXDOGED = "DOGE"

[edge]
# Calibration edges (MODEL tier, shadow until promoted): live markets in a category x time-to-close x price band
# where the atlas (`omen atlas`, rebuilt weekly) found Kalshi's prices wrong after fees, confirmed on held-out weeks.
# Dormant while no validated edge exists.
enabled = true
max_atlas_age_days = 21
prior_sd = 0.03                   # shrinks measured mispricings toward 0 (true ones are usually small)
min_confidence = 0.90             # P(after-fee edge > 0) needed for a signal
min_ev = 0.01                     # expected profit per contract after fees, dollars
kelly_fraction = 0.25             # suggested stake = 1/4 Kelly x bankroll
bankroll_usd = "1000"
max_capital_usd = "200"

[gates]
# A model's plays reach #kalshi-plays only after these pass on resolved shadow data AND `omen promote` is run.
min_resolved_signals = 150
min_distinct_events = 30
min_after_fee_roi_lower_bound = 0.0
bootstrap_confidence = 0.95
max_calibration_error = 0.05
bootstrap_samples = 2000

[alerts]
cooldown_minutes = 60             # re-alert a live play only after this long...
improvement_pct = "25"            # ...and only if its profit improved this much
post_gone_updates = true          # edit the alert to GONE when the play disappears
digest_hour_et = 20               # daily digest to #kalshi-status at 8 pm New York time
max_alerts_per_cycle = 10
max_research_alerts_per_hour = 12  # shadow-model signals

[paper]
enabled = true                    # record every alerted play at its verified prices and settle it

[execution]
mode = "off"                      # off | demo | live  (live also needs OMEN_LIVE_ACK)
max_cost_per_play_usd = "50"
max_daily_cost_usd = "200"
allow_models = false
kill_switch_file = "KILL"         # create <state_dir>/KILL to stop all execution immediately

[liquidity]
# `omen lp run` (or the omen-lp service): rest bids where Kalshi's Liquidity Incentive Program pays for them.
# See docs/LIQUIDITY.md. Paper fills come from the public tape; live also needs keys and OMEN_LIVE_ACK.
mode = "paper"                    # paper | live   (env OMEN_LP_MODE overrides)
cycle_seconds = 60
max_markets = 100
sides = "cheap"                   # cheap: one bid on the cheaper side (same reward, a fraction of the capital) | both
min_quote_price = 0.02
max_quote_price = 0.50
capital_per_market_usd = 25.0     # resting bids plus inventory, per market
max_total_capital_usd = 1000.0
max_series_share = 0.30           # no series (often one news event or settlement) gets more than 30% of the capital
max_contracts_per_order = 500
min_reward_per_day_usd = 5.0
min_program_hours = 24.0          # the Oct 28, 2026 rules allow periods of 1-7 days (shorter ones lost money anyway)
max_program_hours = 168.0
stop_before_close_minutes = 720   # cheap-side fills in the last 12 h before close lost ~7c/contract; earlier ones marked out +2c
# series where resting orders were picked off in the backtest (fast prices, scheduled data, live sports)
exclude_series = '15M$|^KXTEMP\w*H$|RATEH$|^KXAAAGAS|^KXDIESEL|MATCH$|^KXCRYPTOLEAD|GAME$|SPREAD|TOTAL|MENTION|SAY|TRUTHSOCIAL|ELIMINATION|^KXVMA|NETFLIX'
# only quote where the formula reward is at least this many dollars per contract per day: cheap-side fills cost
# 2.6c (1.6-3.9) per contract-day in the settled replay
min_reward_per_contract_day = 0.04
# 1c bids that complete the empty side of decided markets (rewards pay only when both sides reach the target)
complete_dead_sides = true
dead_side_max_loss_usd = 50.0     # per market: at most 5,000 contracts filled at 1c
dead_side_exclude_series = '15M$|^KXTEMP\w*H$|RATEH$|^KXCRYPTOLEAD'
# skip markets where people sell into 1c bids faster than the reward pays for (trailing 24 h; contracts per minute
# such a bid rested, at 1c each, must cost at most this share of the reward)
dead_side_max_flow_ratio = 0.5
dead_side_flow_prior = 3.0        # contracts a minute assumed until 30 minutes of 1c bids were seen (median 2.8)
dead_side_stop_before_close_minutes = 360   # dead-side bids lose at most 1c a contract; 6 h beat 12 h in the replay
# what docs/PLAYBOOK.md's scout counts, so OMEN trades what the GO test measured: sides with no bid at all (the only
# kind the replays bid), at least $30 a period (room for the $1 minimum), Target Size up to 1,000 (1,100 contracts at
# 1c fit a $12 per-market loss cap), and programs that run to within 24 h of the market's close
dead_side_empty_only = true
dead_side_min_period_reward_usd = 30.0
dead_side_max_target = 1000.0
dead_side_close_gap_hours = 24.0
# Kalshi runs several matching engines (shards) and keeps a balance on each; an API order fails unless its shard
# holds the funds. 97% of rewarded markets trade on shard 0 (Oct 2026); list others only after funding them
# (Kalshi's target balance allocation or an intra-account transfer).
exchange_indexes = [0]

summary_every_hours = 6
# live only: write the kill file (cancel everything, place nothing) once fills over the trailing 72 h cost more than
# 60% of the rewards estimated for those hours, after at least $5 of fills. The replays had fills at about a third of
# the rewards; an independent live run of 1c dead-side bids found more. Remove <state_dir>/KILL to resume.
fill_guard_ratio = 0.6
fill_guard_min_usd = 5.0
fill_guard_hours = 72
max_fill_loss_usd = 0.0           # live trial: 15 (docs/PLAYBOOK.md); 0 is off
# `omen lp scout` (docs/PLAYBOOK.md): GO for one capped measurement only when all of these hold
scout_go_pool_per_day_usd = 20000.0
scout_go_markets = 30
scout_go_series = 5
scout_long_program_weight = 0.3
scout_rewards_confirmed = false   # true only once Kalshi's Liquidity Rewards page matches the API's per-market rewards
