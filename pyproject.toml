[project]
name = "omen"
version = "0.1.0"
description = "OMEN: high-confidence Kalshi prediction-market scanner with fee-exact edges, paper ledger and Discord alerts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# Only needed for authenticated order placement (demo/live execution). Scanning and alerts need no keys.
exec = [
    "cryptography>=42",
]

[project.scripts]
omen = "omen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "cryptography>=42",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
